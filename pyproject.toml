[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nemor-link"
version = "0.2.0"
description = "Unified client for local LLM/STT/TTS services (Nemor ecosystem)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
nemor-link = "nemor_link.cli:main"

[tool.setuptools]
packages = ["nemor_link"]
