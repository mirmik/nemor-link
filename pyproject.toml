[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-link"
version = "0.2.0"
description = "Trusted, application-scoped connections to self-hosted LLM/STT/TTS services"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "mirmik", email = "mirmikns@yandex.ru" },
]
keywords = [
    "self-hosted-ai",
    "local-llm",
    "openai-compatible",
    "speech-to-text",
    "text-to-speech",
    "certificate-pinning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.scripts]
inference-link = "inference_link.cli:main"
nemor-link = "inference_link.cli:deprecated_main"

[project.urls]
Repository = "https://github.com/mirmik/inference-link"
Issues = "https://github.com/mirmik/inference-link/issues"

[tool.setuptools]
packages = ["inference_link", "nemor_link"]
